<!DOCTYPE html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ebeae4">
<title>Feil nummer – en historie i en telefon</title>
<style>
:root{
  --paper:#ebeae4; --sheet:#f7f6f1; --ink:#000; --soft:#303030; --rule:#8c8c85;
  --slate:#34506a; --red:#86423c; --moss:#44603f; --okbg:#e2e8e0; --warnbg:#f1e4df; --meb:#1c1c1c; --mef:#f7f6f1;
  --fs:21px;
  --serif:"Charter","Iowan Old Style","Noto Serif","Droid Serif","Source Serif Pro",Georgia,"Times New Roman",serif;
  --sans:system-ui,-apple-system,"Segoe UI","Roboto","Noto Sans",sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --paper:#121212; --sheet:#1d1d1c; --ink:#efece4; --soft:#cfcbc2; --rule:#6f6f69; --slate:#a8bdd3; --red:#dca39c; --moss:#a9c6a1; --okbg:#243028; --warnbg:#3b2a27; --meb:#efece4; --mef:#121212; }
}
:root[data-theme="dark"]{ --paper:#121212; --sheet:#1d1d1c; --ink:#efece4; --soft:#cfcbc2; --rule:#6f6f69; --slate:#a8bdd3; --red:#dca39c; --moss:#a9c6a1; --okbg:#243028; --warnbg:#3b2a27; --meb:#efece4; --mef:#121212; }
*,*::before,*::after{ box-sizing:inherit; transition:none !important; animation:none !important; scroll-behavior:auto !important; }
html{ height:100%; scroll-padding-top:env(safe-area-inset-top,0px); }
body{ height:100%; margin:0; background:var(--paper); color:var(--ink); font-family:var(--serif); font-size:var(--fs); line-height:1.6; -webkit-tap-highlight-color:transparent; -webkit-text-size-adjust:100%; }
#app{ height:100%; display:flex; flex-direction:column; max-width:760px; margin:0 auto; }
#app.inphone{ max-width:none; }
button{ font:inherit; font-size:.92em; color:var(--ink); background:var(--sheet); border:2px solid var(--ink); border-radius:8px; min-height:48px; min-width:48px; padding:.25rem .8rem; cursor:pointer; line-height:1.25; }
button:focus-visible, .w:focus-visible, textarea:focus-visible, input:focus-visible{ outline:3px solid var(--slate); outline-offset:2px; }
button[disabled]{ border-color:var(--rule); color:var(--rule); cursor:default; }
button.primary{ background:var(--ink); color:var(--paper); }
button.primary[disabled]{ background:var(--sheet); color:var(--rule); }
button.primary .en, button[aria-pressed="true"] .en{ color:inherit; }
button.quiet{ border-color:var(--rule); font-size:.8em; }
button.big{ font-size:1em; min-width:8rem; }
.en{ font-family:var(--sans); font-size:.8em; color:var(--soft); line-height:1.4; }
.small{ font-size:.8em; color:var(--soft); }
.center{ text-align:center; justify-content:center; }
h1,h2,h3{ font-weight:600; line-height:1.2; margin:.3em 0 .45em; }
h1{ font-size:1.8em; } h2{ font-size:1.3em; } h3{ font-size:1.05em; }
h2.sec{ font-size:1em; margin:1rem 0 .35rem; }
.row{ display:flex; flex-wrap:wrap; gap:.5rem; align-items:center; margin:.55rem 0; }
.grow{ flex:1; min-width:0; }
.tag{ display:inline-block; border:1px solid var(--rule); border-radius:4px; padding:0 .35em; font-size:.68em; color:var(--soft); vertical-align:middle; font-family:var(--sans); line-height:1.5; }
.art{ display:block; width:100%; height:auto; max-height:32vh; margin:0 auto .8rem; }
.art.thumb{ max-height:5.5rem; width:auto; margin:0 0 .3rem; float:right; }
.w{ cursor:pointer; border-radius:3px; padding:.08em 0; }
.w.sel{ background:var(--ink); color:var(--paper); }
mark{ background:transparent; color:inherit; text-decoration:underline wavy var(--red) 2px; text-underline-offset:4px; font-weight:700; }
/* outside screens */
header.bar{ display:flex; align-items:center; gap:.5rem; padding:.35rem .75rem; border-bottom:2px solid var(--ink); background:var(--paper); }
header.bar .where{ flex:1; text-align:center; font-size:.85em; color:var(--soft); }
main{ flex:1; overflow-y:auto; overflow-x:hidden; -webkit-overflow-scrolling:touch; }
main.outer{ padding:1rem 1.2rem 2rem; }
.title-block{ text-align:center; }
.title-block h1{ font-size:2.6em; font-style:italic; letter-spacing:-.01em; margin:.1em 0 0; }
.title-block p{ margin:.2rem 0 1rem; }
.menu{ display:grid; gap:.6rem; }
.menu button{ text-align:left; display:flex; justify-content:space-between; align-items:baseline; gap:1rem; padding:.5rem 1rem; font-size:1em; }
.entry{ border-bottom:1px solid var(--rule); padding:.7rem 0; overflow:hidden; }
.entry.chapter h3{ margin-top:0; }
.chap-kicker{ color:var(--soft); font-size:.85em; margin:0; }
.learnlist, .howto{ padding-left:1.2rem; } .learnlist li, .howto li{ margin:.35rem 0; }
.line{ margin:.2rem 0 .5rem; } .line.ex{ margin-bottom:0; padding-left:.7rem; border-left:3px solid var(--slate); }
.hook{ font-size:1.15em; font-style:italic; border-left:4px solid var(--ink); padding-left:.8rem; }
.stars{ letter-spacing:.1em; } .stars.big{ font-size:1.5em; }
section.set{ border-bottom:1px solid var(--rule); padding:.7rem 0; }
.seg{ display:flex; flex-wrap:wrap; gap:.4rem; }
.seg button[aria-pressed="true"]{ background:var(--ink); color:var(--paper); }
textarea, .writebox input{ width:100%; font:inherit; font-size:1em; padding:.5rem .7rem; min-height:52px; border:2px solid var(--ink); border-radius:8px; background:var(--sheet); color:var(--ink); resize:vertical; }
#exp, #imp{ font:13px/1.35 ui-monospace,monospace; min-height:9rem; }
.wordrow{ display:flex; align-items:center; gap:.6rem; border-bottom:1px solid var(--rule); padding:.4rem 0; }
.card{ border:2px solid var(--ink); border-radius:10px; background:var(--sheet); min-height:12rem; display:flex; flex-direction:column; justify-content:center; align-items:center; text-align:center; padding:1.2rem; margin:1rem 0; }
.card .front{ font-size:1.7em; font-weight:600; } .card .front.sent{ font-size:1.15em; } .card .en-front{ font-family:var(--sans); font-size:1.25em; }
.card hr{ width:60%; border:0; border-top:1px solid var(--rule); }
.qopt{ display:flex; gap:.6rem; align-items:center; border:2px solid var(--rule); border-radius:8px; padding:.35rem .6rem; margin:.45rem 0; background:var(--sheet); }
.qopt.right{ border-color:var(--moss); background:var(--okbg); } .qopt.wrong{ border-color:var(--red); background:var(--warnbg); }
.mistake{ border-left:3px solid var(--red); padding:.2rem .6rem; margin:.4rem 0; } .mistake.done{ border-left-color:var(--moss); opacity:.8; }
/* phone frame */
.phone{ display:flex; flex-direction:column; height:100%; width:100%; max-width:620px; margin:0 auto; background:var(--paper); }
@media (min-width:640px){ .phone{ height:calc(100% - 20px); margin:10px auto; border:2px solid var(--ink); border-radius:30px; overflow:hidden; } }
.status{ display:flex; align-items:center; gap:.4rem; padding:.2rem .6rem; border-bottom:1px solid var(--rule); }
.status .clock{ flex:1; text-align:center; font-family:var(--sans); font-size:.78em; color:var(--soft); }
.status button{ min-height:44px; }
.appbar{ display:flex; align-items:center; gap:.5rem; padding:.3rem .6rem; border-bottom:2px solid var(--ink); }
.appbar .apptitle{ flex:1; font-weight:600; font-size:1.05em; }
main.screen{ padding:.8rem 1rem 1.2rem; }
.dock{ display:flex; gap:.5rem; justify-content:space-between; align-items:center; padding:.4rem .6rem; border-top:2px solid var(--ink); background:var(--paper); }
.dock button.primary{ flex:1; max-width:22rem; }
/* home */
.lock{ padding:.4rem 0 .6rem; border-bottom:1px solid var(--rule); }
.lock .wd{ font-size:2.4em; font-style:italic; line-height:1; }
.lock .dt{ font-size:1.25em; margin-top:.1rem; }
.lockline{ font-style:italic; margin:.5rem 0 .2rem; }
.notifs{ display:grid; gap:.45rem; }
.notif{ display:flex; gap:.6rem; align-items:center; border:1.5px solid var(--ink); border-radius:12px; padding:.45rem .6rem; background:var(--sheet); }
.notif .who{ font-family:var(--sans); font-size:.78em; font-weight:700; }
.apps{ display:grid; grid-template-columns:repeat(auto-fill,minmax(5.6rem,1fr)); gap:.6rem; margin-top:1rem; }
.app{ position:relative; display:flex; flex-direction:column; align-items:center; gap:.1rem; border:0; background:transparent; padding:.3rem .2rem; min-height:6rem; }
.app .icon{ width:3.6rem; height:3.6rem; margin:0; display:block; border:1.5px solid var(--ink); border-radius:16px; background:var(--sheet); }
.app .aname{ font-family:var(--sans); font-size:.72em; text-align:center; line-height:1.2; }
.badge{ display:inline-block; min-width:1.5em; padding:0 .35em; border-radius:1em; background:var(--ink); color:var(--paper); font-family:var(--sans); font-size:.7em; font-weight:700; text-align:center; line-height:1.5; }
.app .badge{ position:absolute; top:.1rem; right:calc(50% - 2.3rem); }
/* threads */
.thread{ display:flex; flex-direction:column; align-items:stretch; text-align:left; width:100%; border:0; border-bottom:1px solid var(--rule); border-radius:0; background:transparent; padding:.55rem .2rem; gap:.1rem; }
.thread .tname{ font-weight:600; } .thread.unread .tprev{ font-weight:600; color:var(--ink); } .thread .tprev{ color:var(--soft); font-size:.9em; }
.thinfo{ text-align:center; margin-bottom:.4rem; }
.daysep{ text-align:center; font-family:var(--sans); font-size:.72em; color:var(--soft); margin:.9rem 0 .4rem; }
.daysep.today{ color:var(--ink); font-weight:700; }
.bub{ max-width:86%; margin:.35rem 0; padding:.45rem .75rem .25rem; border-radius:16px; line-height:1.5; }
.bub.them{ background:var(--sheet); border:1.5px solid var(--ink); border-bottom-left-radius:4px; }
.bub.me{ background:var(--meb); color:var(--mef); margin-left:auto; border:1.5px solid var(--meb); border-bottom-right-radius:4px; }
.bub.me .w.sel{ background:var(--mef); color:var(--meb); }
.bub.gunvor{ border-color:var(--slate); border-width:2px; }
.bub .who{ font-family:var(--sans); font-size:.72em; font-weight:700; color:var(--slate); }
.bmeta{ display:flex; justify-content:flex-end; align-items:center; gap:.3rem; font-family:var(--sans); font-size:.68em; opacity:.85; }
.bmeta .more{ min-height:36px; min-width:44px; border:0; background:transparent; color:inherit; font-size:1.3em; padding:0 .3rem; }
.photo .art{ max-height:none; margin:.1rem 0 .3rem; border:1px solid var(--rule); border-radius:8px; background:var(--paper); }
.status-line{ text-align:right; font-family:var(--sans); font-size:.72em; color:var(--soft); margin-top:-.1rem; }
.sysline{ text-align:center; font-style:italic; color:var(--soft); font-size:.88em; margin:.6rem 0; }
/* mail */
.mail{ border:1.5px solid var(--ink); border-radius:10px; background:var(--sheet); padding:.6rem .8rem; margin:.6rem 0; }
.mail.mine{ border-style:dashed; }
.mhead{ border-bottom:1px solid var(--rule); padding-bottom:.4rem; margin-bottom:.4rem; font-size:.9em; }
.msubj{ font-weight:700; font-size:1.05em; margin-top:.2rem; }
.mline{ margin:.35rem 0; }
/* calendar, bank, listings */
.calitem{ display:flex; gap:.7rem; border:1.5px solid var(--ink); border-radius:10px; padding:.45rem .6rem; margin:.4rem 0; background:var(--sheet); }
.calitem.clash{ border-color:var(--red); border-width:2.5px; }
.caltime{ font-family:var(--sans); font-weight:700; min-width:3.2em; }
.warn{ color:var(--red); font-size:.88em; }
.bankcard{ border:2px solid var(--ink); border-radius:14px; padding:.8rem 1rem; background:var(--sheet); }
.balance{ font-size:1.8em; font-weight:600; }
.txrow{ display:flex; gap:.6rem; align-items:baseline; border-bottom:1px solid var(--rule); padding:.4rem 0; }
.amt{ font-family:var(--sans); font-weight:700; white-space:nowrap; } .amt.pos{ color:var(--moss); }
.listing{ border:1.5px solid var(--ink); border-radius:12px; padding:.6rem .8rem; margin:.7rem 0; background:var(--sheet); }
.listing .art{ max-height:9rem; border-radius:6px; }
.facts{ display:flex; flex-wrap:wrap; gap:.3rem 1rem; font-family:var(--sans); font-size:.85em; }
/* decisions */
.decide{ border:2.5px solid var(--ink); border-radius:12px; padding:.7rem .8rem; margin:1rem 0; background:var(--sheet); }
.decide .lab, .goal .lab{ display:block; font-family:var(--sans); font-size:.74em; font-weight:700; color:var(--slate); }
.dq{ font-weight:600; margin:.2rem 0 .5rem; }
.dopt{ display:flex; gap:.6rem; align-items:center; border-top:1px solid var(--rule); padding:.5rem 0; }
/* composer */
.composer{ border-top:3px double var(--ink); margin-top:1rem; padding-top:.6rem; }
.goal{ border:2px solid var(--slate); border-radius:10px; background:var(--sheet); padding:.55rem .8rem; margin-bottom:.6rem; }
.gtext{ font-size:1.05em; }
.modes{ margin:.3rem 0 .6rem; }
.checklist{ list-style:none; padding:0; margin:.2rem 0 .6rem; }
.checklist li{ padding:.15rem 0; } .checklist .mark{ display:inline-block; width:1.4em; font-family:var(--sans); font-weight:700; }
.checklist li.yes .mark{ color:var(--moss); } .checklist li.no .mark{ color:var(--red); }
.slot{ min-height:3.8rem; border:2px dashed var(--ink); border-radius:10px; background:var(--sheet); padding:.4rem; display:flex; flex-wrap:wrap; gap:.4rem; align-items:center; margin-bottom:.7rem; }
.slot .empty{ color:var(--soft); font-size:.82em; padding:0 .4rem; }
.bank{ display:flex; flex-wrap:wrap; gap:.45rem; margin-bottom:.4rem; }
.tile{ padding:.2rem .75rem; border-radius:6px; font-size:.95em; }
.slot .tile{ background:var(--ink); color:var(--paper); }
.lookup-on .tile{ border-style:dotted; }
.help{ border-top:1px solid var(--rule); padding-top:.5rem; }
.hint{ background:var(--warnbg); border-left:4px solid var(--red); padding:.45rem .7rem; margin:.45rem 0; border-radius:0 8px 8px 0; }
.okbox{ background:var(--okbg); border-left:4px solid var(--moss); padding:.55rem .8rem; margin:.6rem 0; border-radius:0 8px 8px 0; }
.blank{ font-weight:700; letter-spacing:.05em; }
.wordbank{ display:flex; flex-wrap:wrap; gap:.4rem; margin:.4rem 0; }
.chip{ border:1px solid var(--rule); border-radius:6px; padding:.2rem .5rem; background:var(--sheet); }
.feedback{ margin-top:.6rem; }
.formbox{ border:2px solid var(--ink); border-radius:10px; background:var(--sheet); padding:.6rem .8rem; margin:.4rem 0 .6rem; }
.formbox .lab{ font-family:var(--sans); font-size:.74em; font-weight:700; color:var(--slate); }
.field{ display:block; margin:.55rem 0; }
.field .flabel{ display:block; font-size:.92em; }
.field.yes .flabel b{ color:var(--moss); } .field.no .flabel b{ color:var(--red); }
.formin{ width:100%; font:inherit; font-size:1em; padding:.35rem .6rem; min-height:48px; border:2px solid var(--ink); border-radius:8px; background:var(--paper); color:var(--ink); }
.field.no .formin{ border-color:var(--red); }
.unsure{ border-left-color:var(--slate); }
.fbhead{ font-weight:700; margin-bottom:.3rem; }
.preview{ border:1px dashed var(--rule); border-radius:12px; padding:.2rem .5rem; margin:.3rem 0 .5rem; }
.yours{ margin:.2rem 0 .4rem; white-space:pre-line; }
.bub .btext{ white-space:pre-line; } .corrected{ font-weight:600; margin:.2rem 0 .5rem; }
.model{ border-left:3px solid var(--slate); padding:.1rem .7rem; margin:.45rem 0; }
.model .row{ margin:.3rem 0 .1rem; }
.opener main.screen{ padding-top:1.2rem; }
.intro{ font-size:1.05em; }
/* word panel */
#sheet{ position:fixed; left:0; right:0; bottom:0; max-height:78%; overflow-y:auto; background:var(--sheet); border-top:3px solid var(--ink);
  padding:1rem 1.2rem calc(1rem + env(safe-area-inset-bottom,0px)); z-index:10; }
#sheet[hidden]{ display:none; }
#sheet .inner{ max-width:720px; margin:0 auto; }
#sheet .word{ font-size:1.6em; font-weight:600; line-height:1.2; }
#sheet .mean{ font-size:1.1em; margin:.3rem 0 .5rem; }
#sheet dl{ margin:.4rem 0; display:grid; grid-template-columns:auto 1fr; gap:.15rem .8rem; font-size:.9em; }
#sheet dt{ color:var(--soft); font-family:var(--sans); font-size:.82em; padding-top:.2em; }
#sheet dd{ margin:0; }
#sheet .ex{ border-top:1px solid var(--rule); margin-top:.6rem; padding-top:.5rem; }
#sheet .dial{ background:var(--warnbg); padding:.3rem .6rem; margin:.4rem 0; border-radius:6px; }

/* dark theme: illustrations sit on a paper card, like prints */
:root[data-theme="dark"] .art, :root[data-theme="dark"] .app .icon{ background:#dcd9d0; border-radius:10px; }
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]):not([data-theme="dark"]) .art, :root:not([data-theme="light"]):not([data-theme="dark"]) .app .icon{ background:#dcd9d0; border-radius:10px; } }
.scrim{ position:fixed; inset:0; background:transparent; z-index:9; }
</style>
</head>

<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<filter id="wc" x="-10%" y="-10%" width="120%" height="120%"><feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="3" seed="3" result="n"/>
<feDisplacementMap in="SourceGraphic" in2="n" scale="12" xChannelSelector="R" yChannelSelector="G" result="d"/><feGaussianBlur in="d" stdDeviation="0.6"/></filter>
</defs></svg>
<div id="app"></div>
<div id="sheet" hidden role="dialog" aria-label="Word help"></div>
<script>
/* =====================================================================
   FEIL NUMMER — DATA SECTION
   Everything story-related lives here, above the engine. To add a
   chapter, edit only this section: fill in its "days" and "quiz", add
   GLOSSARY words, and set status:"ready". The engine never needs edits.
   ---------------------------------------------------------------------
   TEXT MARKUP (any Norwegian string {t:"…", en:"…"}):
     Plain words are looked up in GLOSSARY by lowercase form.
     Multi-word GLOSSARY keys ("i dag", "helt på tuppa") match automatically.
     {surface|key}  force a unit and/or a sense, e.g. {da|da:when}
     {name}         the player's first name
     {v:varName}    a story variable (e.g. a weekday captured from a reply)

   CHAPTER: { id, status:"ready"|"outline", level:"A2-1"…, title:{t,en},
     art:"sceneKey", intro:{t,en}, syllabus:{canDo:[], grammar:[{id,name,en,ex:[{t,en}]}], vocab},
     days:[DAY], quiz:[QUIZ], hook:{t,en}, plan?:{…outline only…} }
   DAY:   { date:"2026-08-13", lock:{t,en}, beats:[BEAT] }
   BEAT (exactly one action key; any beat may add  if:"condition"):
     { sms:"thread", time:"16:48", t, en, photo?:"sceneKey" }   text message
     { mail:"thread", time, subject:{t,en}, body:[{t,en}…] }     email
     { note:{t,en} }                     grey system line on the home screen
     { cal:{id,date,time,title:{t,en},place?:{t,en}} }  add calendar entry
     { calMove:{id,date,time} }          move a calendar entry
     { bank:{d:"2026-08-13", t, en, a:-199} }           bank transaction
     { clue:{id,t,en} }                  added to Notater → Spor
     { contact:{th,name} }               rename a thread (unknown number → name)
     { unlock:"appId" | "gunvorHelp", note?:{t,en} }
     { set:{var:value | "+1" | "-1"} }
     { task:TASK }   { decide:DECIDE }   { group:[BEAT…] }
   CONDITIONS: "trustJonas>=2", "promise=1", "!toldJonas", "dec:c1_d1=0",
     "pick:c1_t1=2", "mode:c1_t1=write", "typed:c1_t2", "intent:c1_t5=accept";
     join with " & ".
   DECIDE: { id, th, q:{t,en}, opts:[{t,en, set?, then?:[BEAT]}] }
   TASK (a reply the player writes):
     { id, th:"thread" | "mail:thread", kind:"key" | "small",
       focus:["v2"…] (syllabus grammar ids), register:"casual"|"neutral"|"polite"|"formal",
       prompt:{t,en}, question?:true, end?:"." ,
       accept?:[PATTERN]          whole reply must match one (one-sentence tasks)
       soft?:[{p:PATTERN, en}]    accepted, with an English tip
       checklist?:[ITEM]          every item must appear somewhere (longer tasks)
       intents?:[{id, checklist:[ITEM]}]  different acceptable messages → branches
       free?:{need:[PATTERN]}     small talk only: any error-free sentence containing one
       errors?:[{p:PATTERN, cat, en, fix?, soft?}]   task-specific learner errors
       picks?:[{t,en,tone:{t,en},set?}]  suggested replies (kind:"small" only)
       tiles:{words:[…correct order], extra:[distractors], chunks?:true}
       hints:{words:[…], frame:"… ___ …"}   model = models[0]
       gunvor?:[{t,en}×3]  "Spør Gunvor" ladder (auto-built from hints if missing)
       bank:[glossary keys]    models:[{t,en}]   capture?:{opts:{word:{var:value}},def}
       then?:[BEAT] thenPick?:[[BEAT]…] thenWrite?:[BEAT] thenTyped?:[BEAT]
       thenIntent?:{id:[BEAT]}   tests?:["must pass"…]  fails?:[["must fail","cat"]…] }
     ITEM: { id, t, en, any:[PATTERN] }
   PATTERN: lowercase words.  (a|b c) choice · [x] optional · * any one word
     # any number · {name} player's name · <S> a subject · <V> a finite verb
   QUIZ:  { q:{t,en}, opts:[{t,en}…], a:index, why:"English" }
   ===================================================================== */

const GAME = {
  title: { t: "Feil nummer", en: "Wrong Number" },
  subtitle: { t: "En historie i en telefon", en: "A story told through a phone" },
  menuArt: "title",
  year: 2026,
  defaultName: "Alex"
};

/* ---------- language lists used by the error detectors ---------- */
const LANG = {

/* ---------- state & storage ---------- */

/* ---------- dates ---------- */
const WD = ["søndag","mandag","tirsdag","onsdag","torsdag","fredag","lørdag"];
function parseDate(d){ const p = String(d).split("-").map(Number); return new Date(Date.UTC(p[0], p[1] - 1, p[2])); }

/* ---------- text substitution ---------- */
function subst(text){
  return String(text == null ? "" : text)
    .replace(/\{name\}/g, "{" + playerName() + "|__name__}")
    .replace(/\{v:(\w+)\}/g, (m, k) => String(ST().vars[k] != null ? ST().vars[k] : ""));
}
function substEn(text){ return String(text == null ? "" : text).replace(/\{name\}/g, playerName()).replace(/\{v:(\w+)\}/g, (m, k) => String(ST().vars[k] != null ? ST().vars[k] : "")); }
const strip = s => subst(s).replace(/\{([^}|]+)(?:\|[^}]+)?\}/g, "$1");

/* ---------- tokenizer (tap-any-word) ---------- */
function gl(key){
  if(key === "__name__") return { en: "your name", b: playerName(), c: "proper noun", n: "This is you – the name you chose at the start." };
  if(key === "__en__") return { en: "(English – the task gives this in English; write it in Norwegian)", c: "English" };
  if(key === "__num__") return { en: "a number or a time", c: "number", n: "Norwegian writes times with a full stop or colon: 09.30 = half past nine («halv ti»). Large numbers use a space: 38 000." };
  return G[key];
}
function tokenize(text){
  const re = /\{([^}|]+)(?:\|([^}]+))?\}|(\d{1,2}[.:]\d{2}\b|\d[\d ]*\d|\d)|([0-9A-Za-zÀ-ɏ]+(?:[-’'][0-9A-Za-zÀ-ɏ]+)*)|(\s+)|([^\s])/gu;
  const raw = []; let m;
  while((m = re.exec(text))){
    if(m[1] !== undefined) raw.push({ w: 1, s: m[1], k: (m[2] || m[1]).toLowerCase(), x: 1 });
    else if(m[3] !== undefined) raw.push({ w: 1, s: m[3], k: "__num__", x: 1 });
    else if(m[4]) raw.push({ w: 1, s: m[4] });
    else if(m[5]) raw.push({ sp: 1, s: m[5] });
    else raw.push({ s: m[6] });
  }
  const out = [];
  for(let i = 0; i < raw.length; i++){
    const t = raw[i];
    if(t.w && !t.x){
      let done = false;
      for(let n = 4; n >= 2 && !done; n--){
        let jj = i, cnt = 1, ok = true;
        while(cnt < n){ const a = raw[jj + 1], b = raw[jj + 2]; if(a && a.sp && a.s === " " && b && b.w && !b.x){ jj += 2; cnt++; } else { ok = false; break; } }
        if(!ok) continue;
        const ws = []; for(let q = i; q <= jj; q += 2) ws.push(raw[q].s.toLowerCase());
        const key = ws.join(" ");
        if(G[key]){ out.push({ w: 1, s: raw.slice(i, jj + 1).map(r => r.s).join(""), k: key }); i = jj; done = true; }
      }
      if(done) continue;
      t.k = t.s.toLowerCase();
    }
    out.push(t);
  }
  return out;
}
/* Lines on screen, so the word panel can translate the whole message. */
let LINES = [];
function tapText(text, en, ch, extra){
  const s = subst(text);
  const li = LINES.push(Object.assign({ t: s, en: substEn(en || ""), ch: ch || curChId() }, extra || {})) - 1;
  return tokenize(s).map(t => t.w
    ? `<span class="w" role="button" tabindex="0" data-k="${esc(t.k)}" data-s="${esc(t.s)}" data-l="${li}">${esc(t.s)}</span>`

}
function curChId(){ const c = CHAPTERS[ST().ch]; return c ? c.id : 0; }

/* ---------- speech (browser voices, never required) ---------- */
let voice = null, voicesLoaded = false, ttsWarned = false;
function pickVoice(){
  try{
    if(!("speechSynthesis" in window)) return null;
    const vs = speechSynthesis.getVoices() || [];
    if(vs.length) voicesLoaded = true;
    const norm = v => (v.lang || "").toLowerCase().replace("_", "-");
    voice = vs.find(v => norm(v) === "nb-no") || vs.find(v => norm(v) === "no-no") || vs.find(v => /^(nb|no|nn)\b/.test(norm(v))) || null;
  } catch(e){ voice = null; }
  return voice;
}
try { if("speechSynthesis" in window){ pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; } } catch(e){}
const TTS_HELP = `<p><b>No Norwegian voice was found on this device.</b> Everything else works without audio.</p>
<p class="en"><b>iPhone / iPad:</b> Settings → Accessibility → Spoken Content → Voices → Norwegian → download a voice (e.g. Nora). Then reload this page.</p>
<p class="en"><b>Android / Boox:</b> Settings → Language &amp; input (on Boox: Settings → More settings) → Text-to-speech output. Choose <b>Speech Services by Google</b> (install it from the Play Store if needed), tap its gear icon → Install voice data → <b>Norsk bokmål</b>. Then reload this page.</p>`;
function speak(text){
  try{
    if(!("speechSynthesis" in window)){ showTtsHelp(); return; }
    pickVoice();
    if(!voice && voicesLoaded){ showTtsHelp(); return; }
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(strip(text).replace(/[•]/g, ""));
    u.lang = voice ? voice.lang.replace("_", "-") : "nb-NO";
    if(voice) u.voice = voice;
    u.rate = S.settings.rate;
    speechSynthesis.speak(u);
  } catch(e){ showTtsHelp(); }
}
function showTtsHelp(){

}

      const n = res.filter(x => x.hit).length;

    best.res.forEach(x => { if(x.hit) r.slips = r.slips.concat(x.hit.slips); });
    const covered = [];
    best.res.forEach(x => { if(x.hit) for(let q = x.hit.start; q < x.hit.start + x.hit.len; q++) covered.push(q); });

}
function punctuate(toks, fixed, end){

function starsFor(how, d, cap3){ let s = how === "typed" ? 3 : how === "tiles" ? 2 : 1; if(cap3) s = Math.min(s, cap3); s -= Math.min(d.hint, 2); if(d.hint >= 3) s = Math.min(s, 1); if(d.fails >= 2) s--; return Math.max(1, Math.min(3, s)); }

function sendTask(task){

    t.msgs.push({ id: "me" + Date.now().toString(36), from: "me", mail: true, subject: subj, body, time, date: curDate() }); }

    case "check-form": { const t = curTask(); doCheckForm(t); rerenderKeep(); break; }
    case "send-anyway": { const t = curTask(), c = cstate(t), r = c.fb; if(!r || !r.unsure) break;
      if(V.scr === "practice"){ c.ok = { r, text: c.typed, how: "typed", display: tidyMessage(c.typed, t.end), unsure: true }; rerenderKeep(); break; }
      c.ok = { r, text: c.typed, how: "typed", display: tidyMessage(c.typed, t.end), unsure: true }; sendTask(t); scrollToEnd = true; render(); break; }
    case "retry": { const c = cstate(curTask()); c.fb = null; rerenderKeep(); const inp = document.getElementById("typed"); if(inp) inp.focus(); break; }
    case "undo-ok": { const c = cstate(curTask()); c.ok = null; c.fb = null; rerenderKeep(); break; }
    case "ins": { const inp = document.getElementById("typed"); if(inp){ const s0 = inp.selectionStart != null ? inp.selectionStart : inp.value.length, s1 = inp.selectionEnd != null ? inp.selectionEnd : s0; inp.value = inp.value.slice(0, s0) + btn.dataset.v + inp.value.slice(s1); inp.focus(); inp.setSelectionRange(s0 + 1, s0 + 1); cstate(curTask()).typed = inp.value; } break; }
    case "hint": case "gunvor": { const t = curTask(), c = cstate(t), d = V.scr === "practice" ? c.draft : st.drafts[t.id]; const inp = document.getElementById("typed"); if(inp) c.typed = inp.value;
      if(d.hint < 3){ d.hint++; d.shown = (d.shown || []).concat([{ l: d.hint, who: a }]); } save(); rerenderKeep(); break; }
    case "bank": { const c = cstate(curTask()); c.bank = !c.bank; rerenderKeep(); break; }
    case "pick": { const t = curTask(), c = cstate(t), i = +btn.dataset.i, p = t.picks[i];
      c.ok = { r: { toks: richTokens(p.t).toks, words: normWords(p.t), slips: [], intent: null, register: null }, text: p.t, how: "pick", pick: i, display: strip(p.t) };
      sendTask(t); scrollToEnd = true; render(); break; }
    case "send": { const t = curTask(); sendTask(t); scrollToEnd = true; render(); break; }
    case "save-sent": { const t = curTask(); const m = t && t.models && t.models[+btn.dataset.i]; if(m){ saveSentence(m.t, m.en); btn.innerHTML = "✓ " + bi("Lagret", "Saved"); } break; }
    case "drill-next": { PR.i++; render(); break; }
    case "practice": startPractice(btn.dataset.cat); break;
    case "quiz": startQuiz(+btn.dataset.ch); break;
    case "answer": { QZ.answered = +btn.dataset.i; if(QZ.answered === CHAPTERS[QZ.ch].quiz[QZ.i].a) QZ.score++; rerenderKeep(); break; }
    case "qnext": QZ.i++; QZ.answered = null; go({ scr: "quiz" }); break;
    case "sort": S.wordSort = btn.dataset.v; save(); render(); break;
    case "unsave": delete S.saved[btn.dataset.k]; save(); render(); break;
    case "dir": S.cardDir = btn.dataset.v; if(CARD) CARD.show = false; save(); render(); break;
    case "flip": CARD.show = true; render(); break;
    case "grade": grade(btn.dataset.v); render(); break;
    case "say-card": { const w0 = S.saved[CARD.queue[0]]; if(w0) speak(w0.s); break; }
    case "cards-all": CARD = { queue: Object.keys(S.saved), show: false, done: 0 }; render(); break;
    case "font": S.settings.font = +btn.dataset.v; applySettings(); save(); render(); break;
    case "theme": S.settings.theme = btn.dataset.v; applySettings(); save(); render(); break;
    case "defmode": S.settings.mode = btn.dataset.v; save(); render(); break;
    case "rate": S.settings.rate = +btn.dataset.v; save(); render(); break;
    case "tts-test": speak("Hei! Velkommen til Trondheim."); break;
    case "export": { document.getElementById("io").innerHTML = `<p class="en">Copy all of this text and keep it somewhere safe (a note, or an email to yourself).</p><textarea id="exp" readonly>${esc(JSON.stringify(S))}</textarea><div class="row"><button data-act="copy">${bi("Kopier", "Copy")}</button><span id="copied" class="small"></span></div>`; break; }
    case "copy": { const ta = document.getElementById("exp"); ta.focus(); ta.select(); let ok = false; try { ok = document.execCommand("copy"); } catch(e){}
      try { if(navigator.clipboard) navigator.clipboard.writeText(ta.value).then(() => { document.getElementById("copied").textContent = "Kopiert ✓"; }).catch(() => {}); } catch(e){}
      document.getElementById("copied").textContent = ok ? "Kopiert ✓" : "Text selected – use your device's Copy."; break; }
    case "import-show": document.getElementById("io").innerHTML = `<p class="en">Paste exported text below. This replaces the progress in this browser.</p><textarea id="imp"></textarea><div class="row"><button class="primary" data-act="import">${bi("Importer nå", "Import now")}</button></div><div id="impmsg" class="small"></div>`; break;
    case "import": { const msg = document.getElementById("impmsg");
      try { const o = JSON.parse(document.getElementById("imp").value.trim()); if(!o || o.v !== 1 || !o.story) throw new Error("bad"); S = merge(fresh(), o); for(const k in CMP) delete CMP[k]; save(); applySettings(); msg.textContent = "Importert ✓ Progress restored."; }
      catch(e){ msg.textContent = "That text isn't a valid export. Copy the whole export, from the first «{» to the last «}»."; } break; }
    case "reset": document.getElementById("resetbox").innerHTML = `<p class="en">This deletes your story progress, saved words, flashcards and mistakes in this browser.</p><button data-act="reset-yes">${bi("Ja, slett alt", "Yes, delete everything")}</button>`; break;
    case "reset-yes": { const keep = S.settings; S = fresh(); S.settings = keep; for(const k in CMP) delete CMP[k]; save(); go({ scr: "menu" }); break; }
  }
  } catch(err){ console.error(err); }
});
function lookupTile(t){ const s = String(t).replace(/[,.?!]/g, "").trim(), lo = s.toLowerCase(); const key = G[lo] ? lo : (normWords(s).length === 1 ? normWords(s)[0] : lo); if(G[key]) openWord(key, s, null, null); else openSheetHTML(`<p>${tapText(s, "")}</p><p class="small en">Tap each word for its meaning.</p>`); }
function afterCheck(t){ const c = cstate(t); if(V.scr === "practice" && c.fb){ if(c.fb.pass && !(c.draft && c.draft.fails)) PR.score++; if(c.fb.pass && t.own) t.own.done = true; save(); } rerenderKeep(); const el = document.getElementById("composer"); if(el && c.fb && !c.fb.pass){ const fb = el.querySelector(".feedback"); if(fb) try { fb.scrollIntoView({ block: "nearest", behavior: "auto" }); } catch(e){} } }
document.addEventListener("input", ev => { if(ev.target && ev.target.id === "typed"){ const t = curTask(); if(t) cstate(t).typed = ev.target.value; }
  if(ev.target && ev.target.classList && ev.target.classList.contains("formin")){ const t = curTask(); if(t) cstate(t).form[ev.target.dataset.field] = ev.target.value; } });
document.addEventListener("keydown", ev => {
  if(ev.key === "Enter" && !ev.shiftKey && ev.target && ev.target.id === "typed"){ const t = curTask(); if(t && !/^mail:/.test(t.th || "")){ ev.preventDefault(); doCheck(t, "typed", V.scr === "practice"); afterCheck(t); return; } }
  if(ev.key === "Enter" && ev.target && ev.target.id === "nameinp"){ const b = document.querySelector('[data-act="set-name"]'); if(b) b.click(); }
  if(ev.key === "Escape") closeSheet();
  if((ev.key === "Enter" || ev.key === " ") && ev.target.classList && ev.target.classList.contains("w")){ ev.preventDefault(); ev.target.click(); }
});

/* ---------- test hooks (used by the automatic checks; harmless in play) ---------- */
window.FN_TEST = { get S(){ return S; }, G, TASKS, DECS, CHAPTERS, tokenize, check, expand, normWords, richTokens, gl, FLAT, advance, chooseDecision, sendTask, cstate, doCheckText(task, text){ const c = cstate(task); c.typed = text; const r = check(task, text); c.fb = r; if(r.pass) c.ok = { r, text, how: "typed", display: tidyMessage(fixSlips(text, r.toks, r.slips), task.end) }; return r; }, nextDay, startChapter, render, go, subst, detect, KNOWN, strip, TASK_CH, chapterStars,
  resetAll(name){ S = fresh(); S.name = name || "Alex"; S.howto = true; for(const k in CMP) delete CMP[k]; for(const k in PCACHE) delete PCACHE[k]; },
  answerPick(task, i){ const c = cstate(task), p = task.picks[i]; c.ok = { r: { toks: richTokens(p.t).toks, words: normWords(p.t), slips: [], intent: null, register: null }, text: p.t, how: "pick", pick: i, display: strip(p.t) }; sendTask(task); },
  answerText(task, text, how){ const c = cstate(task); const r = check(task, text); c.fb = r; if(!r.pass){ ST().drafts[task.id].fails++; return r; }
    c.ok = { r, text, how: how || "typed", display: how === "tiles" ? tidyMessage(text, task.end) : tidyMessage(fixSlips(text, r.toks, r.slips), task.end) }; sendTask(task); return r; },
  html(){ return $app.innerHTML; }, checkField, CONTACTS, ENDINGS, testCond,
  answerForm(task, values){ const c = cstate(task); c.form = Object.assign({}, values); const fields = {}; let all = true;
    task.form.forEach(f => { const r = checkField(f, c.form[f.id] || ""); fields[f.id] = r; if(!r.pass) all = false; });
    if(!all) return { pass: false, fields };
    const lines = task.form.map(f => ({ form: true, label: f.label.t, labelEn: f.label.en, t: fields[f.id].fixed || c.form[f.id] }));
    c.ok = { r: { toks: [], words: [], slips: [], intent: null, register: null, formLines: lines }, text: "", how: "typed", display: lines.map(l => strip(l.label) + ": " + l.t).join("\n") }; sendTask(task); return { pass: true }; } };

load(); applySettings(); render();
})();
